name: Daily Expiry Reminder

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = 台灣時間 8:00
  workflow_dispatch:       # 讓你能手動在 GitHub 上點按鈕測試

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Call backend scheduler
        run: |
          curl --fail --connect-timeout 60 --max-time 60 -X POST https://expire-project.onrender.com -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

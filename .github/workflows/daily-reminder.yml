name: Daily Expiry Reminder

on:
  schedule:
    - cron: '0 0 * * *'  # 台灣時間早上 8:00
  workflow_dispatch:       # 讓你能手動點按鈕測試

jobs:
  trigger-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出最新的 GitHub 程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          # 💡 修正拼字：將 node-node-version 改為正確的 node-version，並升級到穩定的 24 版本
          node-version: '24'

      - name: 3. 安裝暫時寄信所需的套件
        run: npm install nodemailer

      - name: 4. 向 Render 索取今天需要寄信的 JSON 清單
        id: fetch_render
        run: |
          RESPONSE=$(curl --fail --connect-timeout 60 --max-time 60 -X POST https://expire-project.onrender.com/debug/run-scheduler -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" )
          echo "DATA=$RESPONSE" >> $GITHUB_ENV

      - name: 5. 由 GitHub 伺服器代工執行寄信指令
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: node action-mailer.js "$DATA"
